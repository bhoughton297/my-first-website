<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="row">
      <header class="header">
        <nav class="nav__bar">
          <div class="logo__container">
          <img src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg" class= "logo" alt="logo" />
          <h2 class="logo__text"> Treact</h2>
        </div>
          <ul class="nav__links">
            <li class="nav__item"><a href="#"> About</a></li>
            <li class="nav__item"><a href="#"> Blog</a></li>
            <li class="nav__item"><a href="#"> Pricing</a></li>
            <li class="nav__item"><a href="#"> Contact Us</a></li>
            <li class="nav__item"><a href="#">Login</a></li>
          </ul>
        <button class="nav__btn">Sign Up</button>
        </nav>
      </header>
      <section class="hero">
        <div class="row">
          <div class="hero__content">
            <h1> Beautiful React <span class="purple">Templates for you.</span> 
            </h1>
            <p> Oue templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.</p>
            <div class="hero__email">
              <input type="email"
              placeholder="Your E-mail Address"/>
              <button>Get Started</button>
            </div>
          </div>
        
          <div class="hero__img">
            <img src="./assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt=""/>
          </div>
        
      </section>
      <section class="trusted">
        <div class="trusted__container">
          <h2>Our Trusted Customers</h2>
          <div class="trusted__logos">
            <img src="./assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="">
          </div>
        </div>
      </section>
</body>
